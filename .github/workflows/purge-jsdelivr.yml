# After every push to main or staging, clear jsDelivr's cache for the bundles
# and check the CDN now serves exactly what is in the repo. Without this the
# CDN can keep serving the old file for up to 12 hours.
name: Purge jsDelivr cache

on:
  push:
    branches: [main, staging]
    paths: ['bundles/**']
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Purge and verify
        run: |
          sleep 5
          fail=0
          for f in bundles/*.js; do
            cdn="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/$f"
            ok=0
            for try in 1 2 3 4 5 6; do
              curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/$f" > /dev/null || true
              sleep 10
              if curl -fsS -H 'Cache-Control: no-cache' "$cdn" | cmp -s - "$f"; then ok=1; break; fi
            done
            if [ "$ok" = 1 ]; then echo "✅ $cdn"; else echo "❌ still stale: $cdn"; fail=1; fi
          done
          exit $fail
